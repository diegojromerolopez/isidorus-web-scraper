apiVersion: v1
kind: Service
metadata:
  namespace: isidorus
  annotations:
    kompose.cmd: kompose convert -f docker-compose.base.yml -f docker-compose.prod.yml -o k8s/base/
    kompose.version: 1.38.0 (HEAD)
  labels:
    io.kompose.service: scylla
  name: scylla
spec:
  ports:
    - name: "8042"
      port: 8042
      targetPort: 8000
    - name: "9042"
      port: 9042
      targetPort: 9042
  selector:
    io.kompose.service: scylla
