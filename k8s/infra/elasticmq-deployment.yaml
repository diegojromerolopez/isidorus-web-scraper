apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: isidorus
  annotations:
    kompose.cmd: kompose convert -f docker-compose.base.yml -f docker-compose.prod.yml -o k8s/base/
    kompose.version: 1.38.0 (HEAD)
  labels:
    io.kompose.service: elasticmq
  name: elasticmq
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: elasticmq
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.base.yml -f docker-compose.prod.yml -o k8s/base/
        kompose.version: 1.38.0 (HEAD)
      labels:
        io.kompose.service: elasticmq
    spec:
      containers:
        - image: softwaremill/elasticmq-native
          imagePullPolicy: IfNotPresent
          livenessProbe:
            exec:
              command:
                - wget --spider http://localhost:9325 || exit 1
            failureThreshold: 5
            periodSeconds: 10
            timeoutSeconds: 5
          name: elasticmq
          ports:
            - containerPort: 9324
              protocol: TCP
            - containerPort: 9325
              protocol: TCP
          volumeMounts:
            - mountPath: /opt/elasticmq.conf
              name: elasticmq-cm0
              subPath: elasticmq.conf
      restartPolicy: Always
      volumes:
        - configMap:
            items:
              - key: elasticmq.conf
                path: elasticmq.conf
            name: elasticmq-cm0
          name: elasticmq-cm0
