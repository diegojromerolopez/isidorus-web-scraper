services:
  # --- Infrastructure ---

  localstack:
    image: localstack/localstack:4.13.1
    ports:
      - "4566:4566"
    environment:
      - SERVICES=sqs,s3,dynamodb
      - DEBUG=1
      - DATA_DIR=/tmp/localstack/data
    volumes:
      - ./infra/e2e:/etc/localstack/init/ready.d
    healthcheck:
      test: [ "CMD", "bash", "-c", "awslocal sqs list-queues && awslocal dynamodb list-tables | grep scraping_jobs" ]
      interval: 10s
      timeout: 20s
      retries: 5
      start_period: 30s

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: [ "CMD", "ollama", "list" ]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama-setup:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=ollama:11434
    entrypoint: /bin/sh
    command: -c "ollama pull tinyllama"

  # --- Application Overrides ---

  api:
    environment:
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - SQS_QUEUE_URL=http://localstack:4566/000000000000/scraper-queue
      - DELETION_QUEUE_URL=http://localstack:4566/000000000000/deletion-queue
      - REDIS_PORT=6379
    depends_on:
      localstack:
        condition: service_healthy

  auth-admin:
    environment:
      - DEBUG=True

  scraper-worker:
    environment:
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - INPUT_QUEUE_URL=http://localstack:4566/000000000000/scraper-queue
      - SUMMARIZER_QUEUE_URL=http://localstack:4566/000000000000/page-summarizer-queue
      - IMAGE_QUEUE_URL=http://localstack:4566/000000000000/image-extractor-queue
      - WRITER_QUEUE_URL=http://localstack:4566/000000000000/writer-queue
      - INDEXER_QUEUE_URL=http://localstack:4566/000000000000/indexer-queue
      - REDIS_PORT=6379
    depends_on:
      localstack:
        condition: service_healthy

  writer-worker:
    environment:
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - INPUT_QUEUE_URL=http://localstack:4566/000000000000/writer-queue
      - DB_BATCH_SIZE=50
    depends_on:
      localstack:
        condition: service_healthy

  image-extractor-worker:
    environment:
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - INPUT_QUEUE_URL=http://localstack:4566/000000000000/image-extractor-queue
      - WRITER_QUEUE_URL=http://localstack:4566/000000000000/writer-queue
      - IMAGE_EXPLAINER_QUEUE_URL=http://localstack:4566/000000000000/image-explainer-queue
    depends_on:
      localstack:
        condition: service_healthy

  image-explainer-worker:
    environment:
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - INPUT_QUEUE_URL=http://localstack:4566/000000000000/image-explainer-queue
      - WRITER_QUEUE_URL=http://localstack:4566/000000000000/writer-queue
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      localstack:
        condition: service_healthy
      ollama:
        condition: service_healthy

  page-summarizer-worker:
    environment:
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - INPUT_QUEUE_URL=http://localstack:4566/000000000000/page-summarizer-queue
      - WRITER_QUEUE_URL=http://localstack:4566/000000000000/writer-queue
      - INDEXER_QUEUE_URL=http://localstack:4566/000000000000/indexer-queue
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      localstack:
        condition: service_healthy
      ollama:
        condition: service_healthy

  indexer-worker:
    environment:
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - INPUT_QUEUE_URL=http://localstack:4566/000000000000/indexer-queue
    depends_on:
      localstack:
        condition: service_healthy

  deletion-worker:
    environment:
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - INPUT_QUEUE_URL=http://localstack:4566/000000000000/deletion-queue
    depends_on:
      localstack:
        condition: service_healthy

volumes:
  ollama_data:
    driver: local
